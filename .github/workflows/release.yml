# Publishes a GitHub release with the installable plugin zip.
#
# How a release happens:
#   Bump the version in slate-admin.php (header and SLATE_ADMIN_VERSION) and in
#   readme.txt (Stable tag), then push to main. If no release exists for that
#   version yet, this workflow tags it (v1.5.0, ...) and publishes it.
#   Pushing a v* tag by hand, or creating a release in the GitHub UI, also works.
#
# The zip always unpacks to a folder named "slate-admin", so uploading a newer
# version in WordPress replaces the old one. The latest zip is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/slate-admin.zip

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read and check the version
        run: |
          header="$(grep -m1 -E '^\s*\*\s*Version:' slate-admin.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          constant="$(grep -m1 "SLATE_ADMIN_VERSION'" slate-admin.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")"
          stable="$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')"
          echo "header=$header constant=$constant stable=$stable ref=$GITHUB_REF"
          if [ -z "$header" ] || [ "$header" != "$constant" ] || [ "$header" != "$stable" ]; then
            echo "::error::Version mismatch: plugin header ($header), SLATE_ADMIN_VERSION ($constant), readme.txt Stable tag ($stable)."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$header" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the plugin version $header."
            exit 1
          fi
          echo "VERSION=$header" >> "$GITHUB_ENV"
          echo "TAG=v$header" >> "$GITHUB_ENV"

      - name: See whether this version is already released
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "EXISTS=yes" >> "$GITHUB_ENV"
          else
            echo "EXISTS=no" >> "$GITHUB_ENV"
          fi

      - name: Build slate-admin.zip
        if: env.EXISTS == 'no' || github.ref_type == 'tag'
        run: |
          mkdir build
          git archive --format=tar --prefix=slate-admin/ "$GITHUB_SHA" | tar -x -C build
          # The repository keeps readable CSS; the shipped zip gets it minified.
          python3 .github/scripts/minify_css.py build/slate-admin/assets/*.css
          (cd build && zip -qr ../slate-admin.zip slate-admin)
          unzip -l slate-admin.zip

      - name: Pull this version's notes from readme.txt
        if: env.EXISTS == 'no'
        run: |
          awk -v v="$VERSION" '
            $0 == "= " v " =" { found = 1; next }
            found && /^= .* =$/ { exit }
            found { print }
          ' readme.txt | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "Slate Admin $VERSION" > notes.md; fi
          cat notes.md

      - name: Publish a new release
        if: env.EXISTS == 'no'
        run: |
          gh release create "$TAG" slate-admin.zip \
            --target "$GITHUB_SHA" \
            --title "Slate Admin $VERSION" \
            --notes-file notes.md

      # A release made by hand in the GitHub UI has no zip yet: attach it.
      - name: Attach the zip to an existing release
        if: env.EXISTS == 'yes' && github.ref_type == 'tag'
        run: gh release upload "$TAG" slate-admin.zip --clobber

      - name: Nothing to do
        if: env.EXISTS == 'yes' && github.ref_type != 'tag'
        run: echo "Release $TAG already exists. Bump the version to publish a new one."
