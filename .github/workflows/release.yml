# Builds the installable plugin zip and publishes a GitHub release whenever a
# version tag (v1.5.0, v2.0.0, ...) is pushed.
#
# The zip always unpacks to a folder named "slate-admin", so uploading a newer
# version in WordPress replaces the old one. The latest zip is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/slate-admin.zip

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(grep -m1 -E '^\s*\*\s*Version:' slate-admin.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          constant="$(grep -m1 "SLATE_ADMIN_VERSION'" slate-admin.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")"
          stable="$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')"
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag does not match the plugin header ($header), SLATE_ADMIN_VERSION ($constant) and readme.txt Stable tag ($stable)."
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Build slate-admin.zip
        run: |
          git archive --format=zip --prefix=slate-admin/ -o slate-admin.zip "$GITHUB_SHA"
          unzip -l slate-admin.zip

      - name: Pull this version's notes from readme.txt
        run: |
          awk -v v="$VERSION" '
            $0 == "= " v " =" { found = 1; next }
            found && /^= .* =$/ { exit }
            found { print }
          ' readme.txt | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "Slate Admin $VERSION" > notes.md; fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" slate-admin.zip \
            --title "Slate Admin $VERSION" \
            --notes-file notes.md \
            --verify-tag
